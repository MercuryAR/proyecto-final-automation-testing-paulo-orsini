<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .t{font-size:13px;fill:#1e293b}
      .h{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:11.5px;fill:#475569}
      .box{stroke-width:1.5;rx:10}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Arquitectura – Framework de Automatización de Pruebas</text>
  <text x="600" y="60" text-anchor="middle" class="s">Pytest · Selenium (Page Object Model) · Requests · GitHub Actions</text>

  <!-- CI -->
  <rect x="40" y="80" width="1120" height="70" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="60" y="105" class="h">GitHub Actions – ci.yml "CI TalentoLab"</text>
  <text x="60" y="128" class="s">checkout → Python 3.12 → pip install → pytest -m smoke → pytest tests/ tests_api/ → sube artifacts (html-report, suite-log)</text>

  <!-- pytest core -->
  <rect x="40" y="185" width="1120" height="110" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="60" y="210" class="h">Núcleo Pytest</text>
  <rect x="60" y="222" width="330" height="60" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="75" y="243" class="h" font-size="13">conftest.py (raíz)</text>
  <text x="75" y="261" class="s">fixtures driver / usuario_logueado · screenshots</text>
  <text x="75" y="275" class="s">en fallos · hooks del reporte HTML · logging</text>
  <rect x="410" y="222" width="330" height="60" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="425" y="243" class="h" font-size="13">tests_api/conftest.py</text>
  <text x="425" y="261" class="s">fixtures específicas de API</text>
  <rect x="760" y="222" width="380" height="60" rx="8" fill="#fff" stroke="#2563eb"/>
  <text x="775" y="243" class="h" font-size="13">pytest.ini + requirements.txt</text>
  <text x="775" y="261" class="s">markers: smoke, ui, api, regression, e2e</text>
  <text x="775" y="275" class="s">pytest-html · pytest-rerunfailures · faker</text>

  <!-- Test layers -->
  <rect x="40" y="335" width="540" height="150" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="60" y="360" class="h">tests/ – UI (22 casos)</text>
  <text x="60" y="385" class="t">test_login.py · test_catalogo.py</text>
  <text x="60" y="405" class="t">test_carrito.py · test_checkout.py</text>
  <text x="60" y="430" class="s">Parametrizados desde CSV/JSON · markers smoke/e2e</text>

  <rect x="620" y="335" width="540" height="150" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="640" y="360" class="h">tests_api/ – API (12 casos)</text>
  <text x="640" y="385" class="t">test_posts_api.py</text>
  <text x="640" y="405" class="t">test_post_lifecycle.py (POST → PATCH → DELETE)</text>
  <text x="640" y="430" class="s">Validación en 5 niveles: status, cabeceras, estructura,</text>
  <text x="640" y="446" class="s">contenido y tiempo</text>

  <!-- Support layer -->
  <rect x="40" y="525" width="270" height="130" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="60" y="550" class="h">pages/ – Page Objects</text>
  <text x="60" y="574" class="t">login_page.py</text>
  <text x="60" y="592" class="t">inventory_page.py</text>
  <text x="60" y="610" class="t">cart_page.py</text>
  <text x="60" y="628" class="t">checkout_page.py</text>

  <rect x="340" y="525" width="300" height="130" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="360" y="550" class="h">utils/</text>
  <text x="360" y="574" class="t">datos.py – lectura CSV/JSON</text>
  <text x="360" y="592" class="t">api_helpers.py – hacer_request,</text>
  <text x="360" y="610" class="t">validar_respuesta_api</text>
  <text x="360" y="628" class="t">logger.py – logger "talentolab"</text>

  <rect x="670" y="525" width="220" height="130" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="690" y="550" class="h">datos/</text>
  <text x="690" y="574" class="t">login.csv</text>
  <text x="690" y="592" class="t">productos.json</text>
  <text x="690" y="610" class="t">checkout.json</text>
  <text x="690" y="628" class="t">posts.json</text>

  <rect x="920" y="525" width="240" height="130" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="940" y="550" class="h">Salidas generadas</text>
  <text x="940" y="574" class="t">reports/report.html</text>
  <text x="940" y="592" class="t">reports/screens/*.png</text>
  <text x="940" y="610" class="t">logs/suite.log</text>

  <!-- Targets -->
  <rect x="40" y="700" width="270" height="80" class="box" fill="#fff" stroke="#16a34a"/>
  <text x="175" y="730" text-anchor="middle" class="h">SauceDemo (web UI)</text>
  <text x="175" y="750" text-anchor="middle" class="s">Selenium WebDriver · Chrome</text>
  <rect x="340" y="700" width="300" height="80" class="box" fill="#fff" stroke="#ca8a04"/>
  <text x="490" y="730" text-anchor="middle" class="h">JSONPlaceholder (REST API)</text>
  <text x="490" y="750" text-anchor="middle" class="s">Requests · HTTP/JSON</text>

  <!-- Arrows -->
  <path class="ln" d="M600 150V185"/>
  <path class="ln" d="M310 295V335"/>
  <path class="ln" d="M890 295V335"/>
  <path class="ln" d="M175 485V525"/>
  <path class="ln" d="M400 485V525"/>
  <path class="ln" d="M780 485V525"/>
  <path class="ln" d="M900 485C900 505 600 500 520 525"/>
  <path class="ln dash" d="M1150 295V525"/>
  <path class="ln" d="M175 655V700"/>
  <path class="ln" d="M490 655V700"/>
  <path class="ln dash" d="M310 590H340"/>
  <text x="700" y="720" class="s">Flechas: dependencia / uso</text>
  <text x="700" y="738" class="s">Tests → Page Objects / utils → sistema bajo prueba</text>
  <text x="700" y="756" class="s">Núcleo pytest ⇢ reports y logs (línea punteada)</text>
</svg>
